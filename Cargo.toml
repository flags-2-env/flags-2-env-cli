[package]
name = "flags-2-env-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CLI for flags-2-env"
repository = "https://github.com/flags-2-env/flags-2-env-cli"

[[bin]]
name = "flags2env-platform"
path = "src/main.rs"

[[bin]]
name = "f2e"
path = "src/main.rs"

[dependencies]
jsonschema = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[lints.rust]
unsafe_code = "forbid"
